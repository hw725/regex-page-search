<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>논어 학이편 읽기 노트</title>
<style>
  body { margin: 0; background: #faf8f3; color: #222; font: 19px/1.9 "Noto Serif KR", "Noto Serif CJK KR", "Nanum Myeongjo", serif; }
  main { max-width: 760px; margin: 0 0 0 64px; padding: 40px 0; }
  h1 { font-size: 30px; margin: 0 0 6px; }
  .sub { color: #777; font-size: 15px; margin-bottom: 28px; font-family: "Pretendard GOV Variable", "Pretendard", system-ui, sans-serif; }
  .orig { font-size: 24px; letter-spacing: 2px; margin: 18px 0; }
  p { margin: 0 0 14px; }
</style>
</head>
<body>
<main>
  <h1>논어(論語) 학이(學而) 제1장</h1>
  <div class="sub">읽기 노트 · 예시 페이지</div>
  <div class="orig">子曰 學而時習之 不亦說乎<br>有朋自遠方來 不亦樂乎<br>人不知而不慍 不亦君子乎</div>
  <p>공자(孔子)께서 말씀하셨다. 배우고(學) 때때로 익히면(時習) 기쁘지 아니한가.</p>
  <p>벗(朋)이 먼 곳에서 찾아오면 즐겁지 아니한가.</p>
  <p>남이 알아주지 않아도 성내지(慍) 않으면 군자(君子)가 아니겠는가.</p>
  <p>첫 글자를 따서 편 이름을 학이(學而)라 하였다. 열(說)은 기쁠 열(悅)과 통한다.</p>
</main>
</body>
